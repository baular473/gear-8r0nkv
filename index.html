<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>강철손 장비·비문 분석</title>
<style>
  :root{--bg:#0b1020;--bg2:#0e1428;--card:#141b30;--card2:#172038;--line:#263150;
        --txt:#e8edf7;--mut:#8a97b2;--gold:#f5b942;--gold2:#ffd27a;
        --accent:#4f8cff;--atk:#ff6b6b;--def:#5bb3ff;--hp:#4fd48a;--delta:#39d98a;--head:#1b2440;}
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#131c3a,#0b1020);color:var(--txt);
       font:14px/1.55 "Inter","Segoe UI",system-ui,sans-serif;}
  header{padding:16px 22px;background:linear-gradient(90deg,#141d38,#0e1428);border-bottom:1px solid var(--line);}
  h1{margin:0;font-size:19px;letter-spacing:.3px;}
  h1 .g{color:var(--gold);}
  .sub{color:var(--mut);font-size:12px;margin-top:3px;}
  .sub a{color:#9fd0ff;text-decoration:none;}
  .wrap{padding:18px 22px;max-width:1400px;margin:0 auto;}
  .tabs{display:flex;gap:8px;margin:12px 0 16px;}
  .tab{padding:8px 16px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card);color:var(--mut);font-weight:600;}
  .tab.on{background:linear-gradient(90deg,#2f6bff,#4f8cff);color:#fff;border-color:transparent;}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  input,select,textarea{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;}
  input::placeholder,textarea::placeholder{color:var(--mut);}
  textarea{width:100%;resize:vertical;min-height:84px;line-height:1.5;}
  .sel{min-width:120px;}
  label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);font-weight:600;}

  /* 업로드 폼 */
  .form{background:linear-gradient(180deg,#141b30,#111831);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:720px;}
  .form .row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
  .form .row > *{flex:1;min-width:150px;}
  .stars-pick{display:flex;gap:3px;font-size:22px;cursor:pointer;user-select:none;}
  .stars-pick span{color:#3a4668;transition:.1s;} .stars-pick span.on{color:var(--gold);text-shadow:0 0 8px rgba(245,185,66,.5);}
  .chk{display:flex;align-items:center;gap:7px;color:var(--txt);font-size:13px;font-weight:600;}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;color:var(--mut);background:#0d1526;transition:.15s;}
  .drop.has{border-color:var(--hp);color:var(--txt);background:#0f1b2e;}
  .drop img{max-width:100%;max-height:190px;border-radius:8px;margin-top:8px;}
  .drop .pv{margin-top:8px;}
  button.go{width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(90deg,#f5b942,#ffcf6e);color:#2a1c00;font-weight:800;cursor:pointer;font-size:15px;letter-spacing:.3px;}
  button.go:disabled{opacity:.55;cursor:default;}
  .msg{margin-top:12px;font-size:13px;min-height:18px;font-weight:600;}
  .msg.ok{color:var(--hp);} .msg.err{color:var(--atk);} .msg.wait{color:var(--gold2);}
  .ocrbox{font-size:11px;color:var(--mut);margin-top:4px;}

  /* 비문 수치 입력 */
  .insc-sec{margin-bottom:14px;}
  .insc-sec-h{font-size:12px;color:var(--gold2);font-weight:700;margin-bottom:8px;}
  .insc-sec-h span{color:var(--mut);font-weight:500;}
  table.insc-in{width:100%;border-collapse:collapse;font-size:12px;}
  table.insc-in th{color:var(--mut);font-weight:700;text-align:center;padding:5px 4px;border-bottom:1px solid var(--line);font-size:11px;}
  table.insc-in th.atk{color:var(--atk);} table.insc-in th.def{color:var(--def);} table.insc-in th.hp{color:var(--hp);} table.insc-in th.all{color:var(--gold2);}
  .drop small{color:var(--mut);font-weight:500;font-size:10.5px;}
  table.insc-in td{padding:5px 4px;}
  table.insc-in td.slot{color:var(--gold2);font-weight:700;white-space:nowrap;font-size:11.5px;}
  table.insc-in input{width:100%;padding:7px 6px;text-align:center;}
  table.insc-in input.bn{text-align:left;}
  table.insc-in input.snm{text-align:left;color:var(--gold2);font-weight:700;}

  /* 갤러리 */
  .govsec{margin:10px 0 26px;}
  .govsec h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:9px;}
  .govsec h3 .nm{border-left:4px solid var(--gold);padding-left:10px;}
  .govsec h3 .ct{color:var(--mut);font-size:12px;font-weight:500;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:18px;}

  .cmd{position:relative;background:linear-gradient(180deg,#141c33,#10172c);border:1px solid var(--line);border-radius:16px;overflow:hidden;
       box-shadow:0 8px 30px rgba(0,0,0,.35);}
  .del-btn{position:absolute;top:8px;right:8px;z-index:3;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);
           background:rgba(20,27,48,.85);color:#8a97b2;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.12s;}
  .del-btn:hover{background:rgba(255,107,107,.9);color:#fff;border-color:transparent;}
  .cmd-head{display:flex;align-items:center;gap:12px;padding:13px 15px;background:linear-gradient(90deg,#1a2murky,#141d38);
            background:linear-gradient(90deg,#1b2banner,#141d38);background:linear-gradient(90deg,#1a243f,#131b32);border-bottom:1px solid var(--line);}
  .portrait{width:52px;height:52px;border-radius:12px;border:2px solid var(--gold);overflow:hidden;flex:0 0 auto;background:#0d1526;}
  .portrait img{width:100%;height:100%;object-fit:cover;}
  .cmd-id{flex:1;min-width:0;}
  .cmd-name{font-size:16px;font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .exp{font-size:10px;font-weight:700;color:#2a1c00;background:linear-gradient(90deg,#f5b942,#ffcf6e);padding:2px 7px;border-radius:6px;letter-spacing:.3px;}
  .cmd-lv{font-size:12px;color:var(--mut);margin-top:2px;}
  .cmd-lv .st{color:var(--gold);letter-spacing:1px;}
  .cmd-badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .bdg{font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;}
  .bdg.troop{background:#20305a;color:#9fc1ff;}
  .bdg.build{background:#2a2440;color:#d7b6ff;}
  .bdg.set{background:#3a2a16;color:var(--gold2);}
  .cmd-date{font-size:11px;color:var(--mut);text-align:right;flex:0 0 auto;}

  .cmd-body{display:flex;gap:12px;padding:12px 14px;align-items:flex-start;}
  /* 장비는 다이아만 잘라 검은 캔버스에 올린 사진 */
  .eqframe{flex:1 1 0;min-width:0;margin:0;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;}
  .eqframe img{width:100%;height:auto;object-fit:contain;background:#000;cursor:zoom-in;display:block;}
  .eqframe figcaption{position:static;font-size:10px;color:var(--mut);text-align:center;
                      padding:5px;background:#111a2d;font-weight:600;}

  /* 재구성된 비문 패널 (레퍼런스 스타일) */
  .insc-panel{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .insc-panel .ph{font-size:11px;color:var(--gold2);font-weight:700;letter-spacing:.5px;text-align:center;margin-bottom:1px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px;}
  .chip{font-size:12px;font-weight:800;border-radius:8px;padding:4px 9px;line-height:1.25;}
  .chip.y{background:linear-gradient(180deg,#ffe7a3,#f0b429);color:#3a2400;}
  .chip.b{background:linear-gradient(180deg,#7eb6ff,#2f6fe0);color:#fff;}
  .chip.w{background:linear-gradient(180deg,#f7f8fb,#d5dbe6);color:#1c2433;border:1px solid #c5cedd;}
  .insc-slot{background:linear-gradient(180deg,#111a2f,#0d1526);border:1px solid var(--line);border-radius:9px;padding:7px 9px;}
  .insc-slot .nm{font-size:11px;font-weight:700;color:var(--gold2);margin-bottom:4px;}
  .insc-slot .st{display:flex;gap:6px;flex-wrap:wrap;}
  .insc-slot .st b{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;}
  .insc-slot .st b.a{background:rgba(255,107,107,.14);color:var(--atk);}
  .insc-slot .st b.d{background:rgba(91,179,255,.14);color:var(--def);}
  .insc-slot .st b.h{background:rgba(79,212,138,.14);color:var(--hp);}
  .insc-slot .st b.al{background:rgba(245,185,66,.15);color:var(--gold2);}
  .insc-slot .bn{font-size:10.5px;color:#c7d2e6;margin-top:4px;line-height:1.4;}
  .insc-slot .bn .p{color:var(--delta);font-weight:700;}

  /* 참고용 원본 사진 (접기) */
  .fig{flex:1;margin:0;background:#0d1526;border:1px solid var(--line);border-radius:11px;overflow:hidden;}
  .fig img{width:100%;height:210px;object-fit:contain;background:#0a1120;cursor:zoom-in;display:block;}
  .fig figcaption{font-size:11px;color:var(--mut);text-align:center;padding:5px;background:#111a2d;font-weight:600;}
  .fig .fl{font-size:10px;color:var(--gold2);text-align:center;padding:3px;background:#141d33;}
  .ref-row{display:flex;gap:10px;padding:0 14px 12px;}
  .ref-row .fig img{height:150px;}
  details.refs{padding:0 14px 10px;}
  details.refs summary{cursor:pointer;color:var(--mut);font-size:11px;font-weight:600;outline:none;}
  @media(max-width:520px){.cmd-body{flex-direction:column;}.eqframe{flex:none;width:100%;}}

  .cmd-buffs{padding:4px 15px 15px;}
  .buffs-h{font-size:12px;color:var(--gold2);font-weight:700;letter-spacing:1px;text-align:center;
           border-top:1px solid var(--line);padding-top:10px;margin-bottom:8px;}
  .buffs-b{font-size:12.5px;color:#c7d2e6;white-space:pre-wrap;word-break:break-word;line-height:1.7;}
  .buffs-b .p{color:var(--delta);font-weight:700;}
  .buffs-b .n{color:#ffd27a;font-weight:700;}
  .fm{color:var(--gold2);font-weight:700;}

  .by{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:12px;}
  .by b{color:var(--gold2);}
  .empty{color:var(--mut);padding:30px;text-align:center;}

  #lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:900;cursor:zoom-out;}
  #lb img{max-width:95vw;max-height:95vh;border-radius:10px;}

  /* gate */
  #gate{position:fixed;inset:0;z-index:1000;background:radial-gradient(900px 500px at 50% -150px,#131c3a,#0b1020);display:flex;align-items:center;justify-content:center;}
  .gatebox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 28px;width:min(360px,90vw);text-align:center;box-shadow:0 14px 50px rgba(0,0,0,.55);}
  .gatebox h2{margin:0 0 6px;font-size:19px;} .gatebox h2 .g{color:var(--gold);}
  .gatebox p{color:var(--mut);font-size:12px;margin:0 0 16px;}
  .gatebox input{width:100%;text-align:center;letter-spacing:2px;margin-bottom:10px;padding:12px;}
  .gatebox button{width:100%;padding:12px;border:0;border-radius:9px;background:linear-gradient(90deg,#f5b942,#ffcf6e);color:#2a1c00;font-weight:800;cursor:pointer;}
  .gateerr{color:var(--atk);font-size:12px;height:16px;margin-top:8px;}
  body.locked{overflow:hidden;}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--gold2);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body class="locked">
<div id="gate">
  <div class="gatebox">
    <h2>🛡️ 강철손 <span class="g">장비·비문 분석</span></h2>
    <p>비밀번호를 입력하세요</p>
    <input id="gpw" type="password" placeholder="비밀번호" autocomplete="off">
    <button id="gbtn">입장</button>
    <div class="gateerr" id="gerr"></div>
  </div>
</div>

<header>
  <h1>🛡️ 강철손 <span class="g">장비·비문 분석</span></h1>
  <div class="sub"><a href="https://baular473.github.io/broll-pa7tlu/">← 브롤 추적 홈피</a> · 사진 올리면 자동 분석 카드로 변환 · made by <b style="color:#9fd0ff">Huni</b></div>
</header>

<div class="wrap">
  <div class="tabs">
    <div class="tab on" data-v="list">🖼️ 모음</div>
    <div class="tab" data-v="add">➕ 등록</div>
  </div>

  <!-- 갤러리 -->
  <div id="view-list">
    <div class="bar">
      <input id="q" placeholder="🔍 닉네임·사령관 검색" style="width:220px">
      <select id="ftroop" class="sel"><option value="">전체 병종</option>
        <option>기마</option><option>보병</option><option>궁병</option><option>리더십</option><option>혼합</option></select>
      <select id="fbuild" class="sel"><option value="">전체 빌드</option></select>
      <span class="sub" id="cnt"></span>
    </div>
    <div id="gallery"></div>
  </div>

  <!-- 등록 -->
  <div id="view-add" style="display:none">
    <div class="form">
      <div class="row">
        <label class="fld">닉네임 *
          <input id="f-nick" placeholder="게임 내 닉네임" maxlength="40">
        </label>
        <label class="fld">사령관
          <input id="f-cmd" placeholder="예: 이반 4세" maxlength="40">
        </label>
      </div>
      <div class="row">
        <label class="fld">병종
          <select id="f-troop" class="sel">
            <option>기마</option><option>보병</option><option>궁병</option><option>리더십</option><option>혼합</option></select>
        </label>
        <label class="fld">빌드
          <select id="f-build" class="sel"></select>
        </label>
        <label class="fld">레벨
          <input id="f-level" type="number" min="1" max="60" value="60" style="width:80px">
        </label>
      </div>
      <div class="row">
        <label class="fld">성급
          <div class="stars-pick" id="f-stars"><span data-s="1">★</span><span data-s="2">★</span><span data-s="3">★</span><span data-s="4">★</span><span data-s="5">★</span><span data-s="6">★</span></div>
        </label>
        <label class="chk" style="align-self:flex-end;min-width:120px"><input type="checkbox" id="f-exp"> 전문화(Expertised)</label>
      </div>
      <div class="row">
        <label class="fld">액티브 세트
          <input id="f-set" list="setlist" placeholder="예: 드래곤 브레스">
          <datalist id="setlist">
            <option>지옥의 황무지</option><option>영원한 제국</option><option>드래곤 브레스</option>
            <option>영광의 여신</option><option>기사 세트</option><option>마녀 세트</option>
            <option>늑대 세트</option><option>리바이벌</option><option>숲의 수호자</option>
            <option>수확자</option><option>윈드스웹트</option><option>뱅가드</option>
            <option>전령 세트</option><option>명장 세트</option></datalist>
        </label>
        <label class="fld">진형
          <input id="f-form" placeholder="예: 삼행진 / 쐐기 진형">
        </label>
      </div>
      <div class="row">
        <label class="fld" style="flex:1">① 장비 스크린샷 *
          <div class="drop" id="d-eq">게임 장비 화면 사진 선택/드래그<br><small>어떤 사진이든 장비 구도를 같은 크기로 맞춥니다. 배경은 그대로 둡니다</small>
            <input type="file" id="f-eq" accept="image/*" hidden></div>
        </label>
        <label class="fld" style="flex:1">② 비문 스크린샷
          <div class="drop" id="d-insc">게임 비문 화면 사진(있으면)<br><small>4슬롯 공격·방어·생명·전체피해를 자동 추출</small>
            <input type="file" id="f-insc" accept="image/*" hidden></div>
        </label>
      </div>

      <!-- 비문 수치 입력 → 카드로 재구성 -->
      <div class="insc-sec">
        <div class="insc-sec-h">💠 비문 수치 <span>(사진 올리면 자동 추출 · 틀리면 직접 수정하세요)</span></div>
        <table class="insc-in">
          <thead><tr><th>슬롯</th><th class="atk">공격 %</th><th class="def">방어 %</th><th class="hp">생명 %</th><th class="all">전체피해 %</th><th>특수 보너스</th></tr></thead>
          <tbody id="insc-body"></tbody>
        </table>
      </div>

      <div class="row">
        <label class="fld" style="flex:1">③ 총버프 스크린샷 (선택)
          <div class="drop" id="d-extra">총버프 요약 사진(있으면)
            <input type="file" id="f-extra" accept="image/*" hidden></div>
        </label>
      </div>
      <div class="row">
        <label class="fld" style="flex:1">버프/요약 메모 <span class="ocrbox" id="ocrstat"></span>
          <textarea id="f-buffs" placeholder="사진 올리면 자동 인식(OCR)된 텍스트가 여기 채워집니다. 자유롭게 수정하세요."></textarea>
        </label>
      </div>
      <button class="go" id="submit">등록하기</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div class="by">🛡️ 강철손 장비·비문 분석 · made by <b>Huni</b></div>
</div>

<div id="lb"><img id="lbimg" src=""></div>

</div>

const INSC_SLOTS=["전령의 메시지","전령의 악기","전령의 깃발","전령의 표식"];

/* ===== RoK 지식베이스 + 사진 추출 파서 ===== */
const ROK={
  sets:["기사","늑대","드래곤 브레스","리바이벌","마녀","뱅가드","수확자","숲의 수호자","영광의 여신","영원한 제국","윈드스웹트","지옥의 황무지"],
  setTroop:{"지옥의 황무지":"기마","영원한 제국":"보병","드래곤 브레스":"궁병"},
  inscSlots:["전령의 메시지","전령의 악기","전령의 깃발","전령의 표식"],
};
function _norm(s){return (s||"").replace(/\s+/g,"");}
function _statType(k){k=_norm(k);
  if(k.indexOf("공격")>=0)return"atk"; if(k.indexOf("방어")>=0)return"def";
  if(k.indexOf("생명")>=0||k.indexOf("체력")>=0)return"hp";
  if(k.indexOf("전체피해")>=0||k.indexOf("모든피해")>=0||k.indexOf("전체데미지")>=0)return"all"; return null;}
const _TROOPW=[["기병","기마"],["기마","기마"],["보병","보병"],["궁병","궁병"],["궁수","궁병"],["부대","부대"]];
function _lineTroop(line){const n=_norm(line);for(const[w,t]of _TROOPW){if(n.indexOf(w)===0)return t;}return null;}
const _STAT="(공격|방어|생명|체력|전체\\s*피해|모든\\s*피해|전체\\s*데미지)\\s*[:：]?\\s*\\+?\\s*([0-9]+(?:[.,][0-9]+)?)\\s*%";
function parseRokOCR(raw){
  const text=(raw||"").replace(/\r/g,"");
  const lines=text.split("\n").map(s=>s.trim()).filter(Boolean);
  const flat=_norm(text); let set="",troop="";
  for(const s of ROK.sets){if(flat.indexOf(_norm(s))>=0){set=s;break;}}
  if(set&&ROK.setTroop[set])troop=ROK.setTroop[set];
  const inscStream=[],buffLines=[],troopStat={};
  for(const line of lines){
    let slotName=ROK.inscSlots.find(nm=>_norm(line).indexOf(_norm(nm))>=0)||((/(의\s*메시지|의\s*악기|의\s*깃발|의\s*표식|의\s*인장|의\s*문양)/.test(line))?line.trim():null);
    if(slotName){inscStream.push({slot:slotName});continue;}
    const tr=_lineTroop(line); const re=new RegExp(_STAT,"g"); let m,found=false;
    while((m=re.exec(line))){found=true; const t=_statType(m[1]); if(!t)continue;
      const v=parseFloat(m[2].replace(",","."));
      if(tr){(troopStat[tr]=troopStat[tr]||{})[t]=v;} else {inscStream.push({t,v});}}
    if(tr&&found)buffLines.push(line.trim());
  }
  const slots=[]; let cur=null;
  const newSlot=name=>{cur={name:name||"",atk:0,def:0,hp:0,all:0,bonus:""};slots.push(cur);};
  for(const it of inscStream){ if(it.slot!==undefined){newSlot(it.slot);continue;}
    if(!cur||cur[it.t]){newSlot("");} cur[it.t]=it.v; }
  const trimmed=slots.filter(s=>s.atk||s.def||s.hp||s.all).slice(0,4);
  if(!troop){let best=null,bv=-1; for(const t of["기마","보병","궁병"]){const o=troopStat[t];if(!o)continue;
    const sm=(o.atk||0)+(o.def||0)+(o.hp||0); if(sm>bv){bv=sm;best=t;}} if(best)troop=best;}
  let commander="";
  for(const line of lines.slice(0,8)){const n=line.trim();
    if(!/[가-힣]/.test(n))continue; if(/[0-9%]/.test(n))continue; if(_statType(n))continue;
    if(ROK.sets.some(s=>_norm(n).indexOf(_norm(s))>=0))continue;
    if(/^(기병|기마|보병|궁병|궁수|부대|장비|비문|속성|세트|레벨|성급)/.test(_norm(n)))continue;
    if(ROK.inscSlots.some(s=>_norm(n).indexOf(_norm(s))>=0))continue; if(n.length>12)continue;
    commander=n;break;}
  let buffs=buffLines.length?buffLines.join("\n"):"";
  if(!buffs){const order=["궁병","기마","보병","부대"],parts=[];
    for(const t of order){const o=troopStat[t];if(!o)continue;const seg=[];
      if(o.atk)seg.push("공격 +"+o.atk+"%");if(o.def)seg.push("방어 +"+o.def+"%");if(o.hp)seg.push("생명 +"+o.hp+"%");
      if(seg.length)parts.push("["+t+"] "+seg.join(" · "));} buffs=parts.join("\n");}
  return {commander,set,troop,slots:trimmed,buffs};
}

/* ===== 드롭존 + OCR ===== */
function setupDrop(dropId,inputId,slot,ocr){
  const drop=document.getElementById(dropId), input=document.getElementById(inputId);
  drop.onclick=()=>input.click();
  input.onchange=()=>pick(slot,drop,input.files[0],ocr);
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('has');};
  drop.ondragleave=()=>{if(!FILES[slot])drop.classList.remove('has');};
  drop.ondrop=e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f){try{input.files=e.dataTransfer.files;}catch(_){}pick(slot,drop,f,ocr);}};
}
function pick(slot,drop,file,ocr){
  if(!file)return;
  const show=(f)=>{
    FILES[slot]=f; drop.classList.add('has');
    let pv=drop.querySelector('.pv'); if(!pv){pv=document.createElement('div');pv.className='pv';drop.appendChild(pv);}
    pv.innerHTML=`선택됨: ${file.name}<br><img src="${URL.createObjectURL(f)}">`;
  };
  if(slot==="eq"){
    show(file);
    normalizeGear(file).then(f=>{show(f);}).catch(()=>{});
  }else show(file);
  if(ocr) runOCR(slot,file);
}

/* 장비 구도만 통일. 배경은 지우지 않고, 다이아 군집을 같은 비율(720x960)로 맞춘다. */
const GEAR_W=720, GEAR_H=960;
function gearGold(r,g,b){
  return r>=150&&g>=95&&b<=165&&r>b+30&&g>b+15&&r+g>270;
}
function gearFrame(img){
  const W=img.width,H=img.height;
  let scale=360/Math.max(W,H); if(scale>1)scale=1;
  const sw=Math.max(1,Math.round(W*scale)), sh=Math.max(1,Math.round(H*scale));
  const c=document.createElement("canvas"); c.width=sw; c.height=sh;
  const g=c.getContext("2d",{willReadFrequently:true});
  g.drawImage(img,0,0,sw,sh);
  const d=g.getImageData(0,0,sw,sh).data;
  let mask=new Uint8Array(sw*sh);
  for(let i=0,p=0;i<mask.length;i++,p+=4) if(gearGold(d[p],d[p+1],d[p+2])) mask[i]=1;
  const nxt=new Uint8Array(sw*sh);
  for(let y=1;y<sh-1;y++) for(let x=1;x<sw-1;x++){
    const i=y*sw+x;
    if(mask[i]&&mask[i-1]&&mask[i+1]&&mask[i-sw]&&mask[i+sw]) nxt[i]=1;
  }
  mask=nxt;
  const seen=new Uint8Array(sw*sh), comps=[];
  for(let i=0;i<mask.length;i++){
    if(!mask[i]||seen[i]) continue;
    const q=[i]; seen[i]=1;
    let n=0,x0=sw,y0=sh,x1=0,y1=0;
    while(q.length){
      const k=q.pop(); n++;
      const x=k%sw, y=(k/sw)|0;
      if(x<x0)x0=x; if(y<y0)y0=y; if(x>x1)x1=x; if(y>y1)y1=y;
      const nb=[[k-1,x-1],[k+1,x+1],[k-sw,x],[k+sw,x]];
      for(const [j,nx] of nb){
        if(nx<0||nx>=sw||j<0||j>=mask.length) continue;
        if(mask[j]&&!seen[j]){seen[j]=1; q.push(j);}
      }
    }
    const bw=x1-x0+1, bh=y1-y0+1, ratio=bw/Math.max(1,bh);
    const edge=x0<=2||y0<=2||x1>=sw-3||y1>=sh-3;
    if(n>=120 && ratio>=0.72 && ratio<=1.4 && !edge) comps.push({x0,y0,x1,y1,n});
  }
  let use=comps;
  if(use.length>=4){
    const big=Math.max(...use.map(k=>k.n));
    const sized=use.filter(k=>k.n>=big*0.45);
    if(sized.length>=4) use=sized;
  }
  if(use.length<4) return null;
  let items=use.map(k=>[(k.x0+k.x1)/2,(k.y0+k.y1)/2,(k.x1-k.x0+1)/2,(k.y1-k.y0+1)/2]);
  const xs=items.map(t=>t[0]).sort((a,b)=>a-b);
  const mid=xs[(xs.length/2)|0];
  const col=items.filter(t=>Math.abs(t[0]-mid)<sw*0.08).sort((a,b)=>a[1]-b[1]);
  const medW=items.map(t=>t[2]).sort((a,b)=>a-b)[(items.length/2)|0];
  const medH=items.map(t=>t[3]).sort((a,b)=>a-b)[(items.length/2)|0];
  if(col.length>=2){
    const gaps=[]; for(let i=0;i<col.length-1;i++) gaps.push(col[i+1][1]-col[i][1]);
    const small=Math.min(...gaps);
    for(let i=0;i<gaps.length;i++) if(gaps[i]>small*1.45)
      items.push([(col[i][0]+col[i+1][0])/2,(col[i][1]+col[i+1][1])/2,medW,medH]);
  }
  const inv=1/scale;
  let x0=Math.min(...items.map(t=>t[0]-t[2]));
  let y0=Math.min(...items.map(t=>t[1]-t[3]));
  let x1=Math.max(...items.map(t=>t[0]+t[2]));
  let y1=Math.max(...items.map(t=>t[1]+t[3]));
  const padX=(x1-x0)*0.08, padTop=(y1-y0)*0.03, padBot=(y1-y0)*0.05;
  x0-=padX; y0-=padTop; x1+=padX; y1+=padBot;
  // 사진 바깥의 흰 여백은 구도에서 뺀다
  let L=sw, T=sh, R=0, B=0;
  for(let i=0,p=0;i<sw*sh;i++,p+=4){
    const r=d[p],gch=d[p+1],b=d[p+2],a=d[p+3];
    if(a<20||(r>245&&gch>245&&b>245)) continue;
    const x=i%sw, y=(i/sw)|0;
    if(x<L)L=x; if(y<T)T=y; if(x>R)R=x; if(y>B)B=y;
  }
  if(R<=L||B<=T){ L=0; T=0; R=sw-1; B=sh-1; }
  const aspect=GEAR_W/GEAR_H;
  let bw=x1-x0, bh=y1-y0;
  let cx=(x0+x1)/2, cy=(y0+y1)/2;
  if(bw/bh<aspect) bw=bh*aspect; else bh=bw/aspect;
  const aw=Math.max(1,R-L), ah=Math.max(1,B-T);
  if(bw>aw||bh>ah){ const s=Math.min(aw/bw,ah/bh); bw*=s; bh*=s; }
  cx=Math.min(Math.max(cx,L+bw/2),R-bw/2);
  cy=Math.min(Math.max(cy,T+bh/2),B-bh/2);
  x0=cx-bw/2; y0=cy-bh/2; x1=cx+bw/2; y1=cy+bh/2;
  return [
    Math.max(0,Math.round(x0*inv)),
    Math.max(0,Math.round(y0*inv)),
    Math.min(W,Math.round(x1*inv)),
    Math.min(H,Math.round(y1*inv))
  ];
}
function trimGearRule(img, box){
  const x0=box[0], y0=box[1], x1=box[2], y1=box[3];
  const w=Math.max(1,x1-x0), h=Math.min(14,Math.max(1,y1-y0));
  const c=document.createElement("canvas");
  c.width=w; c.height=h;
  const g=c.getContext("2d",{willReadFrequently:true});
  g.drawImage(img,x0,y0,w,h,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data;
  let last=-1;
  for(let y=0;y<h;y++){
    let dark=0;
    for(let x=0;x<w;x++){
      const p=(y*w+x)*4;
      if(d[p]+d[p+1]+d[p+2]<50) dark++;
    }
    if(dark/w>0.25) last=y;
  }
  if(last<0) return box;
  const ny0=y0+last+1, nh=y1-ny0, nw=nh*(GEAR_W/GEAR_H), mx=(x0+x1)/2;
  return [Math.max(0,Math.round(mx-nw/2)), ny0, Math.min(img.width,Math.round(mx+nw/2)), y1];
}
function normalizeGear(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const W=img.width,H=img.height;
        let box=gearFrame(img)||[0,0,W,H];
        box=trimGearRule(img,box);
        const out=document.createElement("canvas");
        out.width=GEAR_W; out.height=GEAR_H;
        const g=out.getContext("2d");
        const cw=Math.max(1,box[2]-box[0]), ch=Math.max(1,box[3]-box[1]);
        g.drawImage(img,box[0],box[1],cw,ch,0,0,GEAR_W,GEAR_H);
        out.toBlob(b=>{
          if(!b){reject(new Error("blob"));return;}
          resolve(new File([b],"gear.png",{type:"image/png"}));
        },"image/png");
      }catch(e){reject(e);}
    };
    img.onerror=()=>reject(new Error("img"));
    img.src=URL.createObjectURL(file);
  });
}
async function runOCR(slot,file){
  const stat=document.getElementById("ocrstat");
  if(typeof Tesseract==="undefined"){return;}
  stat.innerHTML='<span class="spin"></span>사진에서 데이터 추출 중… (몇 초 걸립니다)';
  try{
    const {data:{text}}=await Tesseract.recognize(file,'kor+eng');
    OCRTEXT[slot]=cleanOCR(text);
    const n=applyExtraction();
    stat.innerHTML=n?`✅ 추출 완료 — ${n} · 값 확인 후 등록하세요`:'인식됨 — 수치는 직접 입력해 주세요';
  }catch(e){ stat.innerHTML='인식 생략(수동 입력 가능)'; }
}
function cleanOCR(t){return (t||"").split("\n").map(l=>l.trim()).filter(l=>l && !/^[^\w가-힣%+\-.]+$/.test(l)).join("\n");}

/* OCR 전체 텍스트를 RoK 파서로 분석해 폼에 자동 채움 */
function allowAuto(el){return el && el.dataset.auto!=="0";}
function autoSet(id,v){const el=document.getElementById(id); if(el&&allowAuto(el)&&v!==""&&v!=null&&v!==0){el.value=v;el.dataset.auto="1";}}
function applyExtraction(){
  const all=[OCRTEXT.eq,OCRTEXT.insc,OCRTEXT.extra].filter(Boolean).join("\n");
  if(!all)return "";
  const p=parseRokOCR(all); const got=[];
  if(p.commander){autoSet("f-cmd",p.commander);got.push("사령관");}
  if(p.set){autoSet("f-set",p.set);got.push("세트");}
  if(p.troop){const tr=document.getElementById("f-troop"); if(allowAuto(tr)){tr.value=p.troop;tr.dataset.auto="1";got.push("병종");}
    const fb=document.getElementById("f-build"); if(allowAuto(fb)&&[...fb.options].some(o=>o.value===p.troop+" 1")){fb.value=p.troop+" 1";fb.dataset.auto="1";}}
  let sc=0;
  p.slots.forEach((sl,i)=>{ if(i>3)return;
    const nm=document.getElementById(`i${i}-nm`);
    if(sl.name&&(allowAuto(nm)||INSC_SLOTS.includes(nm.value))){nm.value=sl.name;nm.dataset.auto="1";}
    autoSet(`i${i}-atk`,sl.atk); autoSet(`i${i}-def`,sl.def); autoSet(`i${i}-hp`,sl.hp); autoSet(`i${i}-all`,sl.all);
    if(sl.atk||sl.def||sl.hp||sl.all)sc++;
  });
  if(sc)got.push(`비문 ${sc}슬롯`);
  if(p.buffs){const ta=document.getElementById("f-buffs"); if(allowAuto(ta)){ta.value=p.buffs;ta.dataset.auto="1";got.push("총버프");}}
  return got.join(", ");
}

async function submit(){
  const msg=document.getElementById("msg");
  const nick=document.getElementById("f-nick").value.trim();
  const build=document.getElementById("f-build").value;
  if(!nick) return say(msg,"닉네임을 입력하세요","err");
  if(!FILES.eq) return say(msg,"장비 스크린샷은 필수입니다","err");
  if(!sb) return say(msg,"Supabase 미설정","err");
  const btn=document.getElementById("submit"); btn.disabled=true;
  say(msg,'<span class="spin"></span>업로드 중…',"wait");
  try{
    const up=async(file,tag)=>{
      const stamp=Date.now(), rid=Math.random().toString(36).slice(2,8);
      let safe=nick.replace(/[^A-Za-z0-9_-]/g,""); if(!safe)safe="u";
      const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
      const p=`${safe}/${stamp}_${rid}_${tag}.${ext}`;
      const r=await sb.storage.from(BUCKET).upload(p,file,{upsert:false,contentType:file.type}); if(r.error)throw r.error;
      return sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl;
    };
    const eqUrl=await up(FILES.eq,"eq");
    let inscUrl=""; if(FILES.insc) inscUrl=await up(FILES.insc,"insc");
    let extraUrl=null; if(FILES.extra) extraUrl=await up(FILES.extra,"extra");
    const num=id=>{const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;};
    const insc=INSC_SLOTS.map((nm,i)=>({name:document.getElementById(`i${i}-nm`).value.trim()||nm,
      atk:num(`i${i}-atk`),def:num(`i${i}-def`),hp:num(`i${i}-hp`),all:num(`i${i}-all`),
      bonus:document.getElementById(`i${i}-bn`).value.trim()}));
    const meta={v:2,
      name:document.getElementById("f-cmd").value.trim(),
      level:+document.getElementById("f-level").value||60,
      stars:STARS, exp:document.getElementById("f-exp").checked,
      troop:document.getElementById("f-troop").value,
      set:document.getElementById("f-set").value.trim(),
      formation:document.getElementById("f-form").value.trim(),
      buffs:document.getElementById("f-buffs").value.trim(),
      insc, extraUrl};
    const ins=await sb.from(TABLE).insert({nickname:nick,build,commander:JSON.stringify(meta),eq_url:eqUrl,insc_url:inscUrl});
    if(ins.error)throw ins.error;
    say(msg,"✅ 등록 완료! '모음' 탭에서 분석 카드를 확인하세요.","ok");
    resetForm(); DATA=null;
  }catch(e){ say(msg,"오류: "+(e.message||e),"err"); }
  btn.disabled=false;
}
function resetForm(){
  ["f-nick","f-cmd","f-set","f-form","f-buffs"].forEach(id=>{const e=document.getElementById(id);e.value="";e.dataset.auto="";});
  document.getElementById("f-level").value=60; document.getElementById("f-exp").checked=false;
  ["f-troop","f-build"].forEach(id=>document.getElementById(id).dataset.auto="");
  document.getElementById("ocrstat").textContent="";
  FILES={eq:null,insc:null,extra:null}; OCRTEXT={};
  INSC_SLOTS.forEach((nm,i)=>{["atk","def","hp","all","bn"].forEach(k=>{const e=document.getElementById(`i${i}-${k}`);e.value="";e.dataset.auto="";});const n=document.getElementById(`i${i}-nm`);n.value=nm;n.dataset.auto="";});
  ["d-eq","d-insc","d-extra"].forEach(id=>{const d=document.getElementById(id);d.classList.remove("has");const pv=d.querySelector(".pv");if(pv)pv.remove();});
}
function say(el,t,c){el.innerHTML=t;el.className="msg "+(c||"");}

/* ===== 갤러리 ===== */
async function loadGallery(){
  if(!sb)return;
  if(!DATA){
    const {data,error}=await sb.from(TABLE).select("*").order("nickname").order("build");
    if(error){document.getElementById("gallery").innerHTML='<p class="empty" style="color:#ff6b6b">불러오기 오류: '+error.message+'</p>';return;}
    DATA=(data||[]).map(parseRow);
  }
  renderGallery();
}
function parseRow(r){
  let m={name:"",level:60,stars:6,exp:false,troop:"",set:"",formation:"",buffs:"",insc:[],extraUrl:null};
  try{const o=JSON.parse(r.commander); if(o&&o.v===2){m={...m,...o};}
      else if(typeof r.commander==="string"&&!r.commander.startsWith("{")) m.name=r.commander;}
  catch(_){ if(r.commander&&!r.commander.startsWith("{")) m.name=r.commander; }
  return {...r,meta:m,_junk:(r.commander&&r.commander.includes("PSPath"))||r.nickname==="__TEST__"||r.nickname==="__DELTEST__"};
}
function renderGallery(){
  if(!DATA)return;
  const q=document.getElementById("q").value.trim().toLowerCase();
  const ft=document.getElementById("ftroop").value, fb=document.getElementById("fbuild").value;
  let rows=DATA.filter(r=>!r._junk)
    .filter(r=>(!q||r.nickname.toLowerCase().includes(q)||(r.meta.name||"").toLowerCase().includes(q))
             &&(!ft||r.meta.troop===ft)&&(!fb||r.build===fb));
  document.getElementById("cnt").textContent=`총 ${rows.length}개 · 인원 ${new Set(rows.map(r=>r.nickname)).size}명`;
  const byNick={}; rows.forEach(r=>{(byNick[r.nickname]=byNick[r.nickname]||[]).push(r);});
  const nicks=Object.keys(byNick).sort((a,b)=>a.localeCompare(b,'ko'));
  let html="";
  if(!nicks.length) html='<p class="empty">아직 등록된 장비·비문이 없습니다. ‘등록’ 탭에서 사진을 올려보세요.</p>';
  nicks.forEach(nk=>{
    byNick[nk].sort((a,b)=>BUILDS.indexOf(a.build)-BUILDS.indexOf(b.build));
    html+=`<div class="govsec"><h3><span class="nm">${esc(nk)}</span><span class="ct">${byNick[nk].length}개 빌드</span></h3><div class="cards">`;
    byNick[nk].forEach(r=>html+=card(r));
    html+=`</div></div>`;
  });
  document.getElementById("gallery").innerHTML=html;
}
function stars(n){n=Math.max(0,Math.min(6,n|0));return '★'.repeat(n)+'☆'.repeat(6-n);}
function hl(t){return esc(t)
  .replace(/([+\-]?\d+(?:\.\d+)?%)/g,'<span class="p">$1</span>')
  .replace(/(?:^|\s)(\+\d+(?:\.\d+)?)(?!%)/g,m=>m.replace(/(\+\d+(?:\.\d+)?)/,'<span class="n">$1</span>'));}
function card(r){
  const m=r.meta, dt=r.created_at?new Date(r.created_at).toLocaleDateString('ko-KR'):"";
  const name=m.name||"(사령관 미입력)";
  const buffsHtml=m.buffs?`<div class="cmd-buffs"><div class="buffs-h">📊 버프 / 요약</div><div class="buffs-b">${hl(m.buffs)}</div></div>`:"";

  // 비문: 수치 입력이 있으면 재구성 패널, 없으면 원본 사진으로 폴백
  const inscData=(m.insc||[]).filter(s=>s.atk||s.def||s.hp||s.all||(s.bonus&&s.bonus.trim()));
  let inscPanel;
  const chipLine=(arr,cls)=>arr&&arr.length?`<div class="chip-row">${arr.map(n=>`<span class="chip ${cls}">${esc(n)}</span>`).join("")}</div>`:"";
  const chipRow=chipLine(m.yellowNames,"y")+chipLine(m.blueNames,"b")+chipLine(m.whiteNames,"w");
  if(inscData.length||chipRow){
    inscPanel=`<div class="insc-panel"><div class="ph">💠 비문</div>${chipRow}`+
      (m.insc||[]).map(s=>{
        const has=s.atk||s.def||s.hp||s.all||(s.bonus&&s.bonus.trim());
        if(!has) return "";
        const st=[s.atk?`<b class="a">공격 +${s.atk}%</b>`:"",
                  s.def?`<b class="d">방어 +${s.def}%</b>`:"",
                  s.hp?`<b class="h">생명 +${s.hp}%</b>`:"",
                  s.all?`<b class="al">전체피해 +${s.all}%</b>`:""].filter(Boolean).join("");
        return `<div class="insc-slot"><div class="nm">${esc(s.name||"총 스탯")}</div>`+
               (st?`<div class="st">${st}</div>`:"")+
               (s.bonus&&s.bonus.trim()?`<div class="bn">${hl(s.bonus)}</div>`:"")+`</div>`;
      }).join("")+`</div>`;
  }else if(r.insc_url){
    inscPanel=`<figure class="eqframe"><img src="${r.insc_url}" onclick="zoom(this.src)"><figcaption>${esc(m.sideLabel||"비문")}</figcaption></figure>`;
  }else{
    inscPanel=`<div class="insc-panel"><div class="ph">💠 비문</div><div class="insc-slot" style="color:#8a97b2;font-size:11px">비문 수치 미입력</div></div>`;
  }

  // 참고용 원본 사진(비문 수치 입력된 경우 접어서 제공)
  let refRow="";
  const refs=[];
  if(inscData.length && r.insc_url) refs.push(`<figure class="fig"><img src="${r.insc_url}" onclick="zoom(this.src)"><figcaption>비문 원본</figcaption></figure>`);
  if(m.extraUrl) refs.push(`<figure class="fig"><img src="${m.extraUrl}" onclick="zoom(this.src)"><figcaption>총버프</figcaption></figure>`);
  if(refs.length) refRow=`<details class="refs"><summary>📎 원본 사진 보기 (${refs.length})</summary><div class="ref-row">${refs.join("")}</div></details>`;

  return `<div class="cmd">
    <button class="del-btn" title="삭제" onclick="askDelete('${r.id}')">🗑</button>
    <div class="cmd-head">
      <div class="portrait"><img src="${r.eq_url}" alt=""></div>
      <div class="cmd-id">
        <div class="cmd-name">${esc(name)} ${m.exp?'<span class="exp">Expertised</span>':''}</div>
        <div class="cmd-lv">${m.level?`Lv.${m.level}`:""} ${m.stars?`<span class="st">${stars(m.stars)}</span>`:""}</div>
        <div class="cmd-badges">
          ${m.troop?`<span class="bdg troop">${esc(m.troop)}</span>`:''}
          <span class="bdg build">${esc(r.build)}</span>
          ${m.set?`<span class="bdg set">${esc(m.set)}</span>`:''}
        </div>
      </div>
      <div class="cmd-date">${dt}${m.formation?`<br><span class="fm">${esc(m.formation)}</span>`:''}</div>
    </div>
    <div class="cmd-body">
      <figure class="eqframe"><img src="${r.eq_url}" onclick="zoom(this.src)"><figcaption>장비</figcaption></figure>
      ${inscPanel}
    </div>
    ${refRow}
    ${buffsHtml}
  </div>`;
}
function zoom(src){const lb=document.getElementById("lb");document.getElementById("lbimg").src=src;lb.style.display="flex";}

/* ===== 삭제 ===== */
function askDelete(id){
  DEL_ID=id;
  const r=(DATA||[]).find(x=>x.id===id);
  document.getElementById("deltarget").innerHTML=r?`<b style="color:#ffd27a">${esc(r.nickname)} · ${esc(r.build)}</b> 등록을 삭제합니다.<br>비밀번호를 입력하세요.`:"이 등록을 삭제합니다.";
  document.getElementById("delerr").textContent="";
  const pw=document.getElementById("delpw"); pw.value="";
  document.getElementById("delmodal").style.display="flex";
  if(!DEL_OK) setTimeout(()=>pw.focus(),30);
}
function closeDel(){document.getElementById("delmodal").style.display="none";DEL_ID=null;}
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function confirmDel(){
  const err=document.getElementById("delerr"), pw=document.getElementById("delpw");
  if(!DEL_OK){
    const h=await sha(pw.value);
    if(h!==DEL_HASH){err.textContent="비밀번호가 틀렸습니다";pw.value="";pw.focus();return;}
    DEL_OK=true; // 세션 동안 재입력 생략
  }
  const id=DEL_ID; const r=(DATA||[]).find(x=>x.id===id);
  err.innerHTML='<span class="spin"></span>삭제 중…'; err.style.color="var(--gold2)";
  try{
    // 스토리지 파일 best-effort 삭제
    const urls=[r&&r.eq_url, r&&r.insc_url, r&&r.meta&&r.meta.extraUrl].filter(Boolean);
    const paths=urls.map(storagePath).filter(Boolean);
    if(paths.length){try{await sb.storage.from(BUCKET).remove(paths);}catch(_){}}
    // 행 삭제 + 실제 반영 확인
    const {error}=await sb.from(TABLE).delete().eq("id",id);
    if(error)throw error;
    const {data:still}=await sb.from(TABLE).select("id").eq("id",id);
    if(still&&still.length){throw new Error("권한 없음(RLS). Supabase에 삭제 정책을 추가해야 합니다.");}
    closeDel(); DATA=null; await loadGallery();
  }catch(e){ err.style.color="var(--atk)"; err.textContent="삭제 실패: "+(e.message||e); }
}
function storagePath(url){const i=(url||"").indexOf("/object/public/"+BUCKET+"/");return i<0?null:decodeURIComponent(url.slice(i+("/object/public/"+BUCKET+"/").length));}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
</script>
